<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; width: 320px; background: #fff; color: #1e1b3a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #eceaf1; }
    header img { width: 34px; height: 34px; border-radius: 50%; background: #ffe3b3; }
    header b { font-size: 14px; display: block; }
    header span { font-size: 12px; color: #77738c; }
    .stat { margin: 14px 16px 0; padding: 14px; background: #f7f6f3; border-radius: 10px; }
    .big { font-size: 26px; font-weight: 700; }
    .sub { color: #77738c; font-size: 13px; }
    h3 { margin: 16px 16px 4px; font-size: 12px; font-weight: 600; color: #77738c; }
    ul { list-style: none; padding: 0; margin: 0 16px; font-size: 13px; }
    li { padding: 8px 0; border-top: 1px solid #eceaf1; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
    li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li:hover span:first-child { text-decoration: underline; }
    .tag { flex: none; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #f0eef5; color: #55516b; }
    .tag.kept { background: #e3f4ec; color: #17734f; }
    .empty { color: #77738c; font-size: 13px; padding: 8px 0; cursor: default; }
    .tx { display: none; margin: 4px 16px 0; padding: 10px; background: #f7f6f3; border-radius: 10px; font-size: 12px; line-height: 1.45; max-height: 220px; overflow-y: auto; }
    .tx.open { display: block; }
    .tx p { margin: 0 0 6px; }
    .tx b { font-weight: 600; }
    .tx button { font: inherit; font-size: 12px; margin-top: 4px; padding: 4px 10px; border-radius: 6px; border: 1px solid #d6d2e0; background: #fff; cursor: pointer; }
    footer { padding: 14px 16px; font-size: 13px; color: #c9c5d6; }
    a { color: #55516b; font-size: 13px; text-decoration: none; }
    a:hover { color: #1e1b3a; text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <img src="judge.svg" alt="" />
    <div><b>Judge Penny</b><span>Guilty if Charged</span></div>
  </header>
  <div class="stat">
    <div class="big" id="kept">$0</div>
    <div class="sub" id="summary">kept so far</div>
  </div>
  <h3>Recent hearings</h3>
  <ul id="history"><li class="empty">No hearings yet. Go shop!</li></ul>
  <div class="tx" id="tx"></div>
  <footer><a href="#" id="settings">Settings</a> · <a href="#" id="clear">Clear history</a></footer>
  <script src="popup.js"></script>
</body>
</html>
