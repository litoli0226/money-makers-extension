<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; width: 320px; background: #fffbf3; color: #1e1b3a; font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #1e1b3a; color: #fffbf3; }
    header img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #f5b83d; }
    header b { font-family: Georgia, serif; font-size: 16px; display: block; }
    header span { font-size: 12px; opacity: .7; }
    .stat { margin: 14px 16px 0; padding: 14px; background: #fff; border: 3px solid #1e1b3a; border-radius: 16px; box-shadow: 0 4px 0 #1e1b3a; }
    .big { font-size: 32px; font-weight: 900; }
    .sub { color: #6b6785; font-size: 13px; }
    h3 { margin: 16px 16px 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #6b6785; }
    ul { list-style: none; padding: 0; margin: 0 16px; font-size: 13px; }
    li { padding: 8px 0; border-top: 2px dashed #d9d4ea; display: flex; justify-content: space-between; gap: 8px; }
    li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag { flex: none; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #e9e5f5; }
    .tag.kept { background: #d6f5e7; color: #13704b; }
    .empty { color: #6b6785; font-size: 13px; padding: 8px 0; }
    footer { padding: 14px 16px; }
    a { color: #1e1b3a; font-weight: 700; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <img src="judge.svg" alt="" />
    <div><b>Judge Penny</b><span>Guilty if Charged</span></div>
  </header>
  <div class="stat">
    <div class="big" id="kept">$0</div>
    <div class="sub" id="summary">kept so far</div>
  </div>
  <h3>Recent hearings</h3>
  <ul id="history"><li class="empty">No hearings yet. Go shop!</li></ul>
  <footer><a href="#" id="settings">Settings</a> · <a href="#" id="clear">Clear history</a></footer>
  <script src="popup.js"></script>
</body>
</html>
