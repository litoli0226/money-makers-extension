<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: 440px; padding: 16px; background: var(--white); display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; }
    .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; }
    .goal { display: flex; flex-direction: column; gap: 6px; }
    .goal b { font-size: 22px; line-height: 1.15; }
    .goal .foot { display: flex; justify-content: space-between; font-size: 12px; }
    .stats { display: flex; flex-direction: column; gap: 10px; }
    .stats .card { padding: 10px 14px; }
    .stats b { display: block; font-size: 22px; line-height: 1.2; }
    h3 { margin: 6px 0 0; font-size: 15px; }
    ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
    li:first-child { border-top: 0; }
    li:hover { background: var(--bill); }
    li .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--blue); color: var(--white); }
    li .ic.green { background: var(--green); color: var(--green-deep); }
    li .ic.plain { background: var(--bill); color: var(--seal); }
    li .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    li .t b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li.empty { cursor: default; color: var(--seal); }
    li.empty:hover { background: none; }
    .tx { display: none; border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 13px; max-height: 240px; overflow-y: auto; }
    .tx.open { display: block; }
    .tx p { margin: 0 0 6px; }
    .tx .court { color: var(--seal); font-size: 12px; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="icons/logo.svg" alt="" />Guilty If Charged</div>
    <button class="btn ghost" id="settings">Settings</button>
  </header>
  <div class="grid">
    <div class="card goal" id="goal"></div>
    <div class="stats">
      <div class="card"><span class="tiny">Saved this month</span><b id="month">$0</b></div>
      <div class="card"><span class="tiny">Cases heard</span><b id="cases">0</b></div>
    </div>
  </div>
  <h3>Recent cases</h3>
  <ul id="history"><li class="empty">No cases yet. They'll show up here after your next checkout.</li></ul>
  <div class="tx" id="tx"></div>
  <script src="popup.js"></script>
</body>
</html>
