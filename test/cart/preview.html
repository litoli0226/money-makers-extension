<!doctype html>
<html><head><meta charset="utf-8"><title>Preview (fake chrome API)</title>
<style>body{font-family:sans-serif;max-width:700px;margin:40px auto}.sc-list-item{border-bottom:1px solid #ddd;padding:12px 0}</style></head>
<body>
<h1>Shopping Cart (preview)</h1>
<p>Dev preview. Stubs chrome.storage so the UI runs without installing the extension.</p>
<div id="sc-active-cart">
  <div class="sc-list-item" data-asin="B0TEST0001" data-price="429.99" data-quantity="1" data-producttitle="Dyson Supersonic Hair Dryer, Nickel/Copper"></div>
  <div class="sc-list-item" data-asin="B0TEST0002" data-price="64.00" data-quantity="1" data-producttitle="Oversized Fleece Hoodie"></div>
</div>
<form onsubmit="event.preventDefault()"><input type="submit" name="proceedToRetailCheckout" value="Proceed to checkout"></form>
<script>
  const store = { settings: { onboarded: true, purpose: "goal", goalName: "Japan trip", goalAmount: "3000", savedSoFar: "800", monthlyBudget: "300", rules: "Extra income goes to savings first", mode: "scripted" }, history: [], recess: {} };
  window.chrome = { storage: { local: {
    get: async (d) => ({ ...d, ...store }),
    set: async (o) => Object.assign(store, o) } },
    runtime: { sendMessage: async () => ({ ok: false, error: "preview" }) } };
</script>
<script src="/src/script.js"></script>
<script src="/src/content.js"></script>
</body></html>
